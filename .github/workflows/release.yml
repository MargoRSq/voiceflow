name: release

# Tag a version to publish: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 is the oldest image that can link at all. ort ships a
          # prebuilt static ONNX Runtime built against glibc 2.38 and
          # libstdc++ 13, so on 22.04 the link fails outright on
          # __isoc23_strtoll and _M_replace_cold. That pins the floor at
          # glibc 2.39 / GLIBCXX_3.4.31, not at anything in our own code.
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          OUT=dist
          mkdir -p "$OUT"

          strip target/release/voiceflow
          TAR="voiceflow-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu.tar.gz"
          tar -czf "$OUT/$TAR" \
            -C target/release voiceflow \
            -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE \
            systemd/voiceflow.service packaging/voiceflow.desktop

          cargo deb --no-build --no-strip -o "$OUT"
          cargo generate-rpm -o "$OUT"

          cd "$OUT" && sha256sum * > "SHA256SUMS-${{ matrix.arch }}.txt"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
          ### Install

          **Debian / Ubuntu**
          ```sh
          sudo apt install ./voiceflow_*_amd64.deb
          ```

          **Fedora / RHEL**
          ```sh
          sudo dnf install ./voiceflow-*.x86_64.rpm
          ```

          **Any other distribution**
          ```sh
          tar -xzf voiceflow-*-x86_64-linux-gnu.tar.gz
          install -Dm755 voiceflow ~/.local/bin/voiceflow
          ```

          Needs glibc 2.39 and libstdc++ 13 or newer — Ubuntu 24.04+,
          Debian 13+, Fedora 40+, Arch, Tumbleweed. That floor comes from the
          prebuilt ONNX Runtime, not from voiceflow itself, and it rules out
          Ubuntu 22.04 and Debian 12. There is no musl build either: ONNX
          Runtime publishes no musl binaries, so Alpine is not supported.

          The speech model is ~2.6 GB and is not bundled — see the README for
          the one-liner that fetches it.
          EOF
          )"
